services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      ML_SERVICE_URL: http://model-service:8000
    depends_on:
      - model-service

  model-service:
    build:
      context: .
      dockerfile: docker/model-service.Dockerfile
    ports:
      - "8000:8000"